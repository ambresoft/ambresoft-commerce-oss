name: Quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full check in the Docker runtime (FrankenPHP, PHP 8.5): Pint, PHPStan, PHPUnit, TypeScript, ESLint, Prettier,
  # Vitest and the production build, then HTTP smoke checks against the running stack.
  quality:
    name: Quality (Docker runtime)
    runs-on: ubuntu-latest
    # About 25 minutes on GitHub's runners: the full PHPUnit suite, Vitest and the production build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure disposable environment
        run: cp .env.example .env
      - name: Install
        run: make install
      - name: Generate local key
        run: docker compose run --rm --no-deps app php artisan key:generate
      - name: Verify
        run: make check
      - name: FrankenPHP HTTP smoke checks
        run: |
          docker compose run --rm --no-deps app php artisan migrate --force
          docker compose up -d --build --wait --wait-timeout 120 app worker scheduler
          curl --fail --silent --show-error http://localhost:8000/up > /dev/null
          curl --fail --silent --show-error --user-agent 'Mozilla/5.0 CMS runtime smoke' http://localhost:8000/admin/login > /dev/null
          curl --fail --silent --show-error http://localhost:8000/build/manifest.json > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/.env)" = 404
      - name: Manifests and dependency advisories
        run: |
          docker compose run --rm --no-deps app composer validate --strict
          docker compose run --rm --no-deps app composer audit
          pnpm audit
          git diff --check
      - name: Stop services without deleting volumes
        if: always()
        run: docker compose down

  # composer.json still supports PHP 8.3+: the code must at least parse and the locked dependencies install there.
  php-compatibility:
    name: PHP ${{ matrix.php }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, intl, zip, bcmath, pcntl, redis
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Platform requirements
        run: composer check-platform-reqs
      - name: Syntax
        run: find app bootstrap config database routes modules tests -name '*.php' -print0 | xargs -0 -n 50 -P 4 php -l > /dev/null
