name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Every Monday: new advisories appear without any code change.
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --no-banner --redact --config /repo/.gitleaks.toml

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Composer audit
        run: composer audit --locked --no-interaction
      - name: pnpm audit
        run: pnpm audit --prod

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  container:
    name: Container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the application image
        run: docker build -f docker/php/Dockerfile -t ambresoft-commerce:scan .
      # Fails on high or critical vulnerabilities that already have a fix: rebuild or update the base image then.
      - name: Trivy
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress ambresoft-commerce:scan
